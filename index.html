<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI小卡棒棒棒！</title>
<meta name="description" content="61 個 AI 概念、8 個群組，每個概念都有正常版與五歲版說明，搭配動態圖解。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* 版型：左側兩層導覽（群組 → 概念）＋右側內容；首頁為 3D 卡片主視覺（參考 glu 3D Card Header）
   色調：暖米白底、珊瑚卡片、粉彩群組色；動態圖舞台在深色模式也維持淺色，確保圖文對比 */
:root {
  --bg: #F2EEE9; --bg2: #EAE4DD; --surface: #FFFFFF; --surface2: #F8F5F1;
  --ink: #1D1A19; --sub: #6E6560; --line: #E1D9D1; --line2: #D3C9BF;
  --accent: #E2735A; --accent-deep: #C9563D; --accent-soft: #F8DCD2; --on-accent: #FFFFFF;
  --on-pastel: #241E1C;
  --c-coral: #EC8467; --c-lilac: #A99BE6; --c-butter: #F0C95C; --c-sky: #86BDEB;
  --c-mint: #7FCBAE; --c-orange: #F1A257; --c-rose: #E996AE; --c-sage: #9FB98A;
  --shadow: 0 1px 2px rgba(80, 50, 40, .06), 0 10px 30px -12px rgba(80, 50, 40, .18);
  --shadow-lg: 0 30px 60px -25px rgba(120, 60, 40, .35);
  /* 動態圖舞台（兩種主題都用淺色） */
  --s-bg: #FBF8F5; --s-soft: #F3EDE7; --s-card: #FFFFFF; --s-ink: #2A2423; --s-sub: #8A807A; --s-line: #E2D9D0;
  --s-coral: #EC8467; --s-peach: #F6C4AC; --s-rose: #EFA3B8; --s-lilac: #B3A6EC; --s-sky: #93C6EE;
  --s-mint: #8ED3B8; --s-butter: #F3CF6A; --s-sage: #ADC598; --s-orange: #F3AA62; --s-deep: #C9563D;
  --f-display: "Outfit", "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Outfit", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-kid: "Huninn", "Outfit", "PingFang TC", "Noto Sans TC", sans-serif;
  --side-w: 288px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1716; --bg2: #211D1B; --surface: #2A2523; --surface2: #25201F;
    --ink: #F4EDE7; --sub: #B2A79F; --line: #3A3330; --line2: #4A413D;
    --accent: #F08A6E; --accent-deep: #F6A48C; --accent-soft: #4A2C24; --on-accent: #1D1A19;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 30px 60px -25px rgba(0, 0, 0, .7);
    --s-bg: #F1EBE5; --s-soft: #E7E0D9; --s-card: #FBF8F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1716; --bg2: #211D1B; --surface: #2A2523; --surface2: #25201F;
  --ink: #F4EDE7; --sub: #B2A79F; --line: #3A3330; --line2: #4A413D;
  --accent: #F08A6E; --accent-deep: #F6A48C; --accent-soft: #4A2C24; --on-accent: #1D1A19;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -12px rgba(0, 0, 0, .6);
  --shadow-lg: 0 30px 60px -25px rgba(0, 0, 0, .7);
  --s-bg: #F1EBE5; --s-soft: #E7E0D9; --s-card: #FBF8F5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14.5px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-synthesis: none; font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.st { font-family: var(--f-display); }

/* ---------- 版面骨架 ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg2); border-right: 1px solid var(--line);
  padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 24px; display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: thin;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; font-family: var(--f-display); font-weight: 700; font-size: 16.5px; }
.brand svg { width: 26px; height: 26px; flex: none; animation: spin 14s linear infinite; }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11.5px; color: var(--sub); letter-spacing: .04em; line-height: 1.2; }
.search { position: relative; }
.search input {
  width: 100%; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 14px 0 38px; font: inherit; font-size: 13px; color: var(--ink);
}
.search svg { position: absolute; left: 13px; top: 11px; width: 18px; height: 18px; color: var(--sub); }
.nav-top { display: grid; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
}
.nav-link svg { width: 18px; height: 18px; flex: none; color: var(--sub); }
.nav-link:hover { background: var(--surface2); }
.nav-link.on { background: var(--surface); box-shadow: var(--shadow); }
.nav-link.on svg { color: var(--accent); }
.nav-label { font-size: 10.5px; letter-spacing: .12em; color: var(--sub); padding: 6px 12px 0; }
.nav-groups { display: grid; gap: 3px; }
.ng-head {
  display: grid; grid-template-columns: 24px 1fr auto 16px; align-items: center; gap: 8px; width: 100%;
  border: 0; background: none; padding: 7px 10px; border-radius: 12px; text-align: left; font-size: 13.5px; font-weight: 600; line-height: 1.35;
}
.ng-head:hover { background: var(--surface2); }
.ng.on > .ng-head { background: var(--surface); box-shadow: var(--shadow); }
.ng-num {
  width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 12px;
  background: var(--gc); color: var(--on-pastel);
}
.ng-count { font-size: 11.5px; color: var(--sub); font-weight: 500; font-variant-numeric: tabular-nums; }
.ng-caret { width: 16px; height: 16px; color: var(--sub); transition: transform .25s; }
.ng.open .ng-caret { transform: rotate(90deg); }
.ng-list { display: none; padding: 4px 0 8px 22px; margin-left: 13px; border-left: 2px solid var(--line); }
.ng.open .ng-list { display: grid; gap: 1px; }
.nt {
  display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 10px; font-size: 12.5px; color: var(--sub); line-height: 1.4;
}
.nt:hover { color: var(--ink); background: var(--surface2); }
.nt.on { color: var(--ink); background: var(--surface); font-weight: 600; box-shadow: var(--shadow); }
.nt .tick { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; }
.nt.done .tick { background: var(--gc); border-color: var(--gc); }
.nt.done .tick::after { content: ""; width: 6px; height: 3px; border: 2px solid var(--on-pastel); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.nt[hidden] { display: none !important; }
.side-foot { margin-top: auto; padding: 12px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); font-size: 12px; }
.side-foot b { font-family: var(--f-display); font-size: 15px; }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--c-coral), var(--c-butter)); transition: width .6s; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 12px clamp(16px, 4vw, 44px); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.menu-btn { display: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); place-items: center; }
.menu-btn svg { width: 20px; height: 20px; }
.crumb { font-size: 12.5px; color: var(--sub); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.crumb a:hover { color: var(--ink); }
.crumb b { color: var(--ink); font-weight: 600; }
.mode {
  margin-left: auto; position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); flex: none; box-shadow: var(--shadow);
}
.mode button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--sub); white-space: nowrap; transition: color .3s; }
.mode button[aria-pressed="true"] { color: var(--on-accent); }
.mode .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--ink); transition: transform .45s cubic-bezier(.5, 1.6, .4, 1), background .3s; }
.mode.kid .knob { transform: translateX(100%); background: var(--accent); }
.mode:not(.kid) button[aria-pressed="true"] { color: var(--bg); }
.content { padding: 8px clamp(16px, 4vw, 44px) 80px; width: 100%; max-width: 1180px; }
.scrim { display: none; }

@media (max-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; z-index: 50; width: min(320px, 86vw); transform: translateX(-102%); transition: transform .35s cubic-bezier(.3, .9, .3, 1); box-shadow: var(--shadow-lg); }
  .app.nav-open .side { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(20, 14, 12, .35); }
  .menu-btn { display: grid; }
  .mode button { padding: 6px 10px; }
}

/* ---------- 通用元件 ---------- */
.eyebrow { font-size: 11px; letter-spacing: .18em; color: var(--sub); font-weight: 600; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 25px; padding: 0 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
}
.pill.c { background: var(--gc); border-color: transparent; color: var(--on-pastel); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 12px; font-weight: 600; font-size: 13.5px;
  border: 1px solid var(--line); background: var(--surface); transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn svg { width: 16px; height: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line); transition: transform .2s, box-shadow .2s; line-height: 1.3;
}
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gc); flex: none; }
.chip:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.chip.done::after { content: "✓"; font-size: 11px; color: var(--sub); }
.sec { margin-top: 52px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(19px, 2.2vw, 24px); font-weight: 600; }
.sec-head p { color: var(--sub); max-width: 52ch; font-size: 13.5px; }
.page { animation: pageIn .5s cubic-bezier(.3, .9, .3, 1) both; }
@keyframes pageIn { from { transform: translateY(14px); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 3D 卡片 ---------- */
.tilt { transform-style: preserve-3d; --rx: 0; --ry: 0; }
.card3d {
  --rx: 0; --ry: 0;
  position: relative; aspect-ratio: 1.5; border-radius: 26px; overflow: hidden; color: var(--on-pastel);
  background: linear-gradient(140deg, color-mix(in srgb, var(--gc) 70%, #fff) 0%, var(--gc) 45%, color-mix(in srgb, var(--gc) 78%, #6b2a1a) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -2px 0 rgba(0, 0, 0, .08), 0 2px 0 color-mix(in srgb, var(--gc) 70%, #000), 0 4px 0 color-mix(in srgb, var(--gc) 62%, #000), var(--shadow-lg);
  transform: rotateX(calc(var(--bx, 14deg) + var(--rx) * 1deg)) rotateY(calc(var(--by, -18deg) + var(--ry) * 1deg)) rotateZ(var(--bz, -6deg));
  transition: transform .5s cubic-bezier(.3, .9, .3, 1);
}
.card3d::after { /* 光澤 */
  content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: radial-gradient(120% 90% at calc(30% + var(--ry) * 2%) calc(20% - var(--rx) * 2%), rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 55%);
}
.card3d .emboss { fill: color-mix(in srgb, var(--gc) 82%, #7a2f1d); filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .5)) drop-shadow(0 -1px 0 rgba(0, 0, 0, .15)); }

/* ---------- 首頁主視覺 ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: center; gap: 12px; padding-top: 12px; }
.hero-copy { display: grid; gap: 22px; align-content: center; position: relative; z-index: 2; }
.hero-copy .spark { width: 28px; height: 28px; animation: spin 10s linear infinite; }
.hero h1 { font-size: clamp(32px, 4.6vw, 58px); line-height: 1.08; font-weight: 600; letter-spacing: -.03em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-copy > p { font-size: 14.5px; color: var(--sub); max-width: 36ch; }
.hero-copy > p b { color: var(--ink); }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-art { position: relative; aspect-ratio: 1 / .92; perspective: 1100px; --mx: 0; --my: 0; }
.obj { position: absolute; transform: translate(calc(var(--mx) * var(--d, 10) * 1px), calc(var(--my) * var(--d, 10) * 1px)); transition: transform .6s cubic-bezier(.3, .9, .3, 1); }
.obj > .in { animation: pop .9s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: var(--delay, .2s); }
.obj .in, .obj .float { width: 100%; height: 100%; }
@keyframes pop { from { transform: scale(.35) rotate(-30deg); } }
.float { animation: floaty var(--fd, 6s) ease-in-out infinite; animation-delay: var(--fdl, 0s); }
@keyframes floaty { 50% { transform: translateY(-12px) rotate(var(--fr, 4deg)); } }

.o-bubble { left: 6%; top: 18%; width: 40%; aspect-ratio: 1; --d: 16; }
.bubble {
  width: 100%; height: 100%; border-radius: 50%;
  background:
    radial-gradient(circle at 30% 26%, rgba(255, 255, 255, .95) 0 5%, rgba(255, 255, 255, 0) 13%),
    radial-gradient(circle at 72% 76%, rgba(255, 255, 255, .55) 0 4%, rgba(255, 255, 255, 0) 16%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0) 52%, rgba(255, 255, 255, .55) 70%, rgba(255, 255, 255, .9) 100%),
    conic-gradient(from 210deg, #ffd3e6, #c6ecff, #e3d6ff, #fff0c4, #c8f5e2, #ffd3e6);
  opacity: .9; box-shadow: inset 0 0 24px rgba(255, 255, 255, .9), 0 30px 50px -30px rgba(120, 90, 160, .5);
  animation: hue 8s linear infinite;
}
@keyframes hue { to { filter: hue-rotate(360deg); } }
.o-fluff { left: 24%; top: 4%; width: 25%; aspect-ratio: 1; --d: 22; z-index: 3; }
.o-pillow { right: 0; top: 16%; width: 52%; aspect-ratio: 1 / 1.25; --d: 8; }
.pillow {
  width: 100%; height: 100%; border-radius: 46% 54% 44% 56% / 40% 42% 58% 60%;
  background:
    radial-gradient(70% 60% at 38% 28%, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 60%),
    radial-gradient(90% 90% at 70% 90%, rgba(150, 50, 30, .35), rgba(150, 50, 30, 0) 60%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .09) 0 6px, rgba(0, 0, 0, .05) 6px 12px),
    repeating-linear-gradient(-45deg, rgba(255, 255, 255, .07) 0 6px, rgba(0, 0, 0, .04) 6px 12px),
    #EE9C86;
  box-shadow: inset -18px -24px 40px rgba(150, 60, 40, .25), 0 40px 60px -30px rgba(150, 60, 40, .45);
}
.o-card { left: 13%; top: 3%; width: 68%; z-index: 4; --d: 4; }
.o-card .card3d { --bx: 16deg; --by: -20deg; --bz: -8deg; }
.o-card .float { --fr: 2deg; --fd: 7s; }
.o-card > .in { animation: cardIn 1.5s cubic-bezier(.2, 1.1, .3, 1) both; }
.o-card .float { perspective: 1100px; }
@keyframes cardIn { from { transform: translateY(90px) rotateX(60deg) rotateY(-50deg) rotateZ(-30deg) scale(.6); } }
.o-terrazzo { left: 12%; top: 57%; width: 27%; aspect-ratio: 1; z-index: 5; --d: 26; }
.o-terrazzo svg { width: 100%; height: 100%; filter: drop-shadow(0 18px 18px rgba(90, 60, 50, .3)); }
.o-terrazzo .float { animation: spinfloat 18s linear infinite; }
@keyframes spinfloat { to { transform: rotate(360deg); } }
.o-gem { width: 7%; aspect-ratio: 1; --d: 30; }
.o-gem svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 6px rgba(120, 80, 100, .25)); }
.o-pearl { width: 8%; aspect-ratio: 1; --d: 34; z-index: 6; }
.pearl { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #fff 0 10%, #F6CDBF 30%, #D98A78 75%, #B9665A); box-shadow: 0 10px 14px -6px rgba(140, 60, 50, .4); }
.hero-note {
  position: absolute; right: 2%; bottom: 3%; z-index: 7; display: flex; gap: 12px; align-items: center; padding: 12px 16px 12px 12px; border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 72%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); font-size: 13.5px; line-height: 1.4; max-width: 240px; font-size: 12.5px;
  animation: pop .8s 1.3s cubic-bezier(.3, 1.5, .5, 1) both;
}
.hero-note .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--accent); display: grid; place-items: center; flex: none; }
.hero-note .ic svg { width: 24px; height: 24px; }
.hero-note b { display: block; font-weight: 600; }
.hero-note span { color: var(--accent-deep); font-weight: 600; }
.hero-note:hover { transform: translateY(-2px); }
.hero-face { position: absolute; inset: 0; padding: 7% 8%; display: flex; flex-direction: column; }
.hero-face .logo { font-family: var(--f-display); font-weight: 600; font-size: clamp(13px, 1.7vw, 19px); color: rgba(255, 255, 255, .92); letter-spacing: -.01em; }
.hero-face svg.flowers { position: absolute; right: 7%; top: 34%; width: 40%; }
.hero-face .meta { margin-top: auto; align-self: flex-end; text-align: right; white-space: nowrap; font-size: clamp(8.5px, .9vw, 11px); color: rgba(255, 255, 255, .92); font-weight: 600; letter-spacing: .06em; }
.hero-face .chipc { width: 15%; aspect-ratio: 1.3; border-radius: 6px; margin-top: 12%; background: linear-gradient(135deg, #FBE3B0, #E7B36A); box-shadow: inset 0 0 0 1px rgba(120, 70, 20, .25); }
.flowers .f { transition: fill .5s; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-art { max-width: 520px; width: 100%; margin: 0 auto; }
  .hero-copy > p { max-width: none; }
}

/* ---------- 吉祥物遊樂場 ---------- */
.hero-art { user-select: none; -webkit-user-select: none; }
.hero-art::before { content: ""; position: absolute; left: 6%; right: 6%; top: 8%; bottom: 12%; border-radius: 50%; background: radial-gradient(closest-side, var(--accent-soft), transparent); opacity: .7; }
.pals-floor { position: absolute; left: 8%; right: 8%; bottom: 22px; height: 16px; border-radius: 50%; background: radial-gradient(closest-side, rgba(120, 70, 50, .12), transparent); }
.pals-hint { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 11.5px; color: var(--sub); letter-spacing: .04em; }
.lucky { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent-deep); padding: 0 6px; }
.lucky svg { width: 16px; height: 16px; }
.lucky:hover { text-decoration: underline; text-underline-offset: 3px; }

}

.pager a { padding: 14px 18px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; display: grid; gap: 2px; min-width: 0; }
.pager a small { color: var(--sub); font-size: 12px; }
.pager a b { font-family: var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager a:hover { transform: translateY(-2px); }
.pager .next { text-align: right; }
.learn { height: 42px; padding: 0 18px; font-size: 13.5px; border-radius: 999px; border: 2px solid var(--ink); background: none; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.learn.done { background: var(--ink); color: var(--bg); }
.learn svg { width: 18px; height: 18px; }
@media (max-width: 600px) { .pager { grid-template-columns: 1fr 1fr; } .pager .mid { grid-column: 1 / -1; grid-row: 1; justify-self: center; } }

/* ---------- 關係圖 ---------- */
.map-wrap { margin-top: 26px; border-radius: 28px; background: var(--surface); box-shadow: var(--shadow); padding: 16px; overflow-x: auto; }
.map-wrap svg { display: block; width: 100%; min-width: 640px; height: auto; }
.map-node { cursor: pointer; }
.map-node rect { transition: transform .3s; }
.map-node:hover .mn-card { transform: translateY(-3px); }
.mn-card { transition: transform .3s; }
.flowline { stroke-dasharray: 7 8; animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -30; } }
.rels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
.rel { padding: 22px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 12px; align-content: start; min-width: 0; }
.rel h3 { font-size: 16px; font-weight: 600; }
.rel .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rel .chain i { font-style: normal; color: var(--sub); font-weight: 700; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(3px); color: var(--accent); } }
.rel p { color: var(--sub); font-size: 13.5px; }
body.kid .rel p, body.kid .ghead .desc, body.kid .pcard p { font-family: var(--f-kid); font-size: 15px; color: var(--ink); }
@media (max-width: 860px) { .rels { grid-template-columns: minmax(0, 1fr); } }

/* ---------- 時間軸 ---------- */
.tl-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.tl-filter button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.tl-filter button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gc, var(--ink)); }
.tl-filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tl { position: relative; margin-top: 30px; display: grid; gap: 14px; padding-left: 0; }
.tl::before { content: ""; position: absolute; left: 86px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: linear-gradient(var(--c-coral), var(--c-lilac), var(--c-sky), var(--c-mint), var(--c-orange)); }
.ev { position: relative; display: grid; grid-template-columns: 70px 1fr; gap: 40px; align-items: start; }
.ev[hidden] { display: none; }
.ev .yr { font-family: var(--f-display); font-weight: 600; font-size: 18px; text-align: right; line-height: 1.2; padding-top: 14px; font-variant-numeric: tabular-nums; }
.ev .yr small { display: block; font-size: 12px; color: var(--sub); font-weight: 500; }
.ev::before { content: ""; position: absolute; left: 79px; top: 20px; width: 17px; height: 17px; border-radius: 50%; background: var(--surface); border: 4px solid var(--gc, var(--accent)); box-shadow: 0 0 0 5px var(--bg); }
.ev .card { padding: 16px 18px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; }
.ev .card p { font-size: 14px; line-height: 1.7; }
.ev .card .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ev .card .chip { font-size: 12.5px; padding: 4px 10px 4px 7px; }
.ev.big .card { border: 2px solid var(--accent); }
.era { position: relative; z-index: 1; padding: 18px 0 4px 56px; }
.era span { display: inline-block; padding: 6px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
.era[hidden] { display: none; }
@media (max-width: 600px) { .era { padding-left: 0; } }
.ev { animation: pageIn .6s both; animation-delay: calc(var(--i) * 30ms); }
@media (max-width: 600px) {
  .tl::before { left: 9px; }
  .ev { grid-template-columns: minmax(0, 1fr); gap: 6px; padding-left: 32px; }
  .ev::before { left: 2px; top: 6px; }
  .ev .yr { text-align: left; padding-top: 0; }
}

/* ---------- 學習路徑 ---------- */
.road { display: grid; gap: 28px; margin-top: 26px; }
.stagep { padding: 24px; border-radius: 28px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 16px; }
.stagep header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between; }
.stagep h2 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.stagep .lvnum { width: 32px; height: 32px; border-radius: 10px; font-size: 15px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 18px; }
.stops { display: flex; flex-wrap: wrap; gap: 10px; counter-reset: s; }
.stop { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; counter-increment: s; transition: transform .2s; }
.stop::before { content: counter(s); width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; background: var(--gc); color: var(--on-pastel); font-family: var(--f-display); font-size: 13px; flex: none; }
.stop.done { background: var(--accent-soft); border-color: transparent; }
.stop.done::after { content: "✓"; color: var(--accent-deep); }
.stop:hover { transform: translateY(-2px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="導覽"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="開啟導覽"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="mode" id="mode" role="group" aria-label="說明版本"><span class="knob"></span><button data-m="normal" aria-pressed="true">正常版</button><button data-m="kid" aria-pressed="false">五歲版</button></div>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>
<script>
/* 動態圖引擎
   每個概念的 scene = { dur, steps: [[秒, 正常版字幕, 五歲版字幕], ...], build(S) { ...畫元素...; return t => { ...依時間更新... } } }
   畫布固定 480×300（viewBox），t 為 0..dur 秒，播完自動重來。 */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const W = 480, H = 300;
  const PAL = ['ink', 'sub', 'line', 'card', 'bg', 'soft', 'coral', 'peach', 'rose', 'lilac', 'sky', 'mint', 'butter', 'sage', 'orange', 'deep'];
  const col = v => (typeof v === 'string' && PAL.includes(v)) ? `var(--s-${v})` : v;

  const E = {
    lin: p => p,
    in: p => p * p * p,
    out: p => 1 - Math.pow(1 - p, 3),
    io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    back: p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
    pop: p => p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI / 3)) + 1,
  };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const r2 = n => Math.round(n * 100) / 100;
  // 估算文字寬度（中日韓字＝1 字寬，其他＝0.58 字寬）
  const textW = (s, size) => { let w = 0; for (const ch of String(s)) w += /[⺀-￿]/.test(ch) ? size : size * .58; return w; };

  function makeS(svg) {
    const S = { W, H, E, col, clamp, textW, root: svg };
    S.lerp = (a, b, p) => a + (b - a) * p;
    S.seg = (t, a, b, e = 'io') => (typeof e === 'function' ? e : E[e])(clamp((t - a) / (b - a)));
    S.inout = (t, a, b, c, d) => Math.min(S.seg(t, a, b), 1 - S.seg(t, c, d));
    S.wave = (t, per = 2, amp = 1, ph = 0) => Math.sin((t / per + ph) * Math.PI * 2) * amp;
    S.mix = (pts, p) => { // 在多個點之間依 p(0..1) 移動：pts=[[x,y],...]
      const n = pts.length - 1, i = Math.min(n - 1, Math.floor(p * n)), q = p * n - i;
      return [S.lerp(pts[i][0], pts[i + 1][0], q), S.lerp(pts[i][1], pts[i + 1][1], q)];
    };

    S.set = (e, a) => {
      for (const k in a) {
        const v = a[k];
        if (v == null || k === 'p') continue;
        if (k === 'fill' || k === 'stroke') e.style[k] = col(v);
        else if (k === 'op') e.style.opacity = v;
        else if (k === 'text') e.textContent = v;
        else e.setAttribute(k, typeof v === 'number' ? r2(v) : v);
      }
      return e;
    };
    S.el = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); S.set(e, a); (p || a.p || svg).appendChild(e); return e; };
    S.g = (o = {}) => S.el('g', o);
    S.at = (e, x = 0, y = 0, s = 1, rot = 0) => { e.setAttribute('transform', `translate(${r2(x)} ${r2(y)})` + (rot ? ` rotate(${r2(rot)})` : '') + (s !== 1 ? ` scale(${r2(Math.max(s, 0.0001))})` : '')); return e; };
    S.op = (e, v) => { e.style.opacity = r2(clamp(v)); return e; };
    S.fill = (e, c) => { e.style.fill = col(c); return e; };

    S.rect = (x, y, w, h, o = {}) => S.el('rect', { x, y, width: w, height: h, rx: o.r ?? 10, fill: o.fill ?? 'card', stroke: o.stroke, 'stroke-width': o.sw, op: o.op, p: o.p });
    S.circle = (x, y, r, o = {}) => S.el('circle', { cx: x, cy: y, r, fill: o.fill ?? 'coral', stroke: o.stroke, 'stroke-width': o.sw, op: o.op, p: o.p });
    S.dot = (x, y, r = 5, fill = 'coral', p) => S.circle(x, y, r, { fill, p });
    S.line = (x1, y1, x2, y2, o = {}) => S.el('line', { x1, y1, x2, y2, fill: 'none', stroke: o.stroke ?? 'line', 'stroke-width': o.sw ?? 2, 'stroke-linecap': 'round', 'stroke-dasharray': o.dash, op: o.op, p: o.p });
    S.path = (d, o = {}) => S.el('path', { d, fill: o.fill ?? 'none', stroke: o.stroke, 'stroke-width': o.sw ?? (o.stroke ? 2 : null), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': o.dash, op: o.op, p: o.p });
    S.text = (x, y, str, o = {}) => S.el('text', {
      x, y, text: str, fill: o.fill ?? 'ink', 'font-size': o.size ?? 14, 'font-weight': o.weight ?? 600,
      'text-anchor': o.anchor ?? 'middle', 'dominant-baseline': 'central', class: 'st', op: o.op, p: o.p,
    });
    // 置中於原點的元件 ↓（用 S.at 移動）
    S.token = (str, o = {}) => {
      const size = o.size ?? 13, w = o.w ?? Math.max(size * 1.6, textW(str, size) + (o.pad ?? 18)), h = o.h ?? size * 2.1;
      const g = S.g({ p: o.p });
      g.box = S.rect(-w / 2, -h / 2, w, h, { r: o.r ?? h / 2, fill: o.fill ?? 'peach', stroke: o.stroke, sw: o.sw, p: g });
      g.label = S.text(0, 0, str, { size, fill: o.color ?? 'ink', weight: o.weight ?? 650, p: g });
      g.w = w; g.h = h;
      if (o.x != null) S.at(g, o.x, o.y ?? 0);
      return g;
    };
    S.flower = (r = 12, o = {}) => {
      const n = o.petals ?? 8, ri = r * .42, pr = r * .36;
      let d = '';
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2, cx = Math.cos(a) * (r - pr), cy = Math.sin(a) * (r - pr);
        d += `M${r2(cx + pr)} ${r2(cy)}A${r2(pr)} ${r2(pr)} 0 1 0 ${r2(cx - pr)} ${r2(cy)}A${r2(pr)} ${r2(pr)} 0 1 0 ${r2(cx + pr)} ${r2(cy)}Z`;
      }
      const g = S.g({ p: o.p });
      S.path(d, { fill: o.fill ?? 'coral', p: g });
      S.circle(0, 0, ri, { fill: o.fill ?? 'coral', p: g });
      if (o.x != null) S.at(g, o.x, o.y ?? 0);
      return g;
    };
    // 吉祥物「小艾」：bot.tick(t) 讓它自動眨眼；bot.look(dx,dy) 轉眼睛；bot.mood('happy'|'wow'|'think'|'sad')
    S.bot = (o = {}) => {
      const g = S.g({ p: o.p }), c = o.color ?? 'coral';
      S.line(0, -30, 0, -40, { stroke: 'ink', sw: 2.5, p: g });
      S.flower(7, { fill: 'butter', p: S.at(S.g({ p: g }), 0, -44) });
      S.rect(-30, -30, 60, 52, { r: 18, fill: c, p: g });
      S.rect(-23, -22, 46, 32, { r: 12, fill: 'card', p: g });
      const eyes = S.g({ p: g });
      g.eL = S.el('ellipse', { cx: -9, cy: -8, rx: 3.6, ry: 4.6, fill: 'ink', p: eyes });
      g.eR = S.el('ellipse', { cx: 9, cy: -8, rx: 3.6, ry: 4.6, fill: 'ink', p: eyes });
      S.circle(-15, 2, 3.2, { fill: 'rose', op: .7, p: g });
      S.circle(15, 2, 3.2, { fill: 'rose', op: .7, p: g });
      g.mouth = S.path('M-5 1 Q0 6 5 1', { stroke: 'ink', sw: 2.2, p: g });
      S.rect(-36, -6, 7, 16, { r: 3.5, fill: c, p: g });
      S.rect(29, -6, 7, 16, { r: 3.5, fill: c, p: g });
      g.eyes = eyes;
      g.tick = t => { const b = (t % 3.1) < .12 ? .15 : 1; g.eL.setAttribute('ry', r2(4.6 * b)); g.eR.setAttribute('ry', r2(4.6 * b)); };
      g.look = (dx = 0, dy = 0) => S.at(eyes, clamp(dx, -3, 3), clamp(dy, -2, 2));
      const M = { happy: 'M-5 1 Q0 6 5 1', wow: 'M-3 3 A3 3 0 1 0 3 3 A3 3 0 1 0 -3 3', think: 'M-5 3 L5 1', sad: 'M-5 4 Q0 -1 5 4' };
      g.mood = m => g.mouth.setAttribute('d', M[m] || M.happy);
      if (o.x != null) S.at(g, o.x, o.y ?? 0, o.s ?? 1);
      return g;
    };
    S.doc = (o = {}) => {
      const w = o.w ?? 46, h = o.h ?? 58, g = S.g({ p: o.p });
      S.path(`M${-w / 2} ${-h / 2 + 4}q0 -4 4 -4h${w - 16}l12 12v${h - 16}q0 4 -4 4h${-w + 8}q-4 0 -4 -4z`, { fill: o.fill ?? 'card', stroke: o.stroke ?? 'line', sw: 1.5, p: g });
      const n = o.lines ?? 4;
      for (let i = 0; i < n; i++) S.rect(-w / 2 + 8, -h / 2 + 16 + i * 8, (w - 16) * (i === n - 1 ? .6 : 1), 3.5, { r: 2, fill: o.accent ?? 'line', p: g });
      if (o.x != null) S.at(g, o.x, o.y ?? 0, o.s ?? 1);
      return g;
    };
    // 箭頭：回傳群組，arrow.draw(p) 讓線從 0 畫到 p（0..1）
    S.arrow = (x1, y1, x2, y2, o = {}) => {
      const g = S.g({ p: o.p }), c = o.color ?? 'sub', bend = o.bend ?? 0;
      const mx = (x1 + x2) / 2 - (y2 - y1) * bend, my = (y1 + y2) / 2 + (x2 - x1) * bend;
      const d = `M${r2(x1)} ${r2(y1)}Q${r2(mx)} ${r2(my)} ${r2(x2)} ${r2(y2)}`;
      // 估算二次貝茲曲線長度
      let len = 0, px = x1, py = y1;
      for (let i = 1; i <= 16; i++) { const s = i / 16, qx = (1 - s) * (1 - s) * x1 + 2 * (1 - s) * s * mx + s * s * x2, qy = (1 - s) * (1 - s) * y1 + 2 * (1 - s) * s * my + s * s * y2; len += Math.hypot(qx - px, qy - py); px = qx; py = qy; }
      const line = S.path(d, { stroke: c, sw: o.sw ?? 2.5, p: g });
      const ang = Math.atan2(y2 - my, x2 - mx) * 180 / Math.PI;
      const head = S.path('M-8 -5 L0 0 L-8 5', { stroke: c, sw: o.sw ?? 2.5, p: g });
      S.at(head, x2, y2, 1, ang);
      if (o.head === false) head.style.display = 'none';
      g.draw = p => {
        p = clamp(p);
        if (o.dash) { line.setAttribute('stroke-dasharray', o.dash); S.op(g, p > 0 ? 1 : 0); }
        else { line.setAttribute('stroke-dasharray', `${r2(len)} ${r2(len)}`); line.setAttribute('stroke-dashoffset', r2(len * (1 - p))); S.op(line, p > .001 ? 1 : 0); }
        S.op(head, p > .92 ? 1 : 0);
        return g;
      };
      g.len = len;
      g.draw(o.drawn === false ? 0 : 1);
      return g;
    };
    S.bubble = (w, h, o = {}) => { // 對話框，左上角在 (-w/2,-h/2)，尾巴指向下方或左方
      const g = S.g({ p: o.p });
      const tail = o.tail ?? 'bottom';
      const td = tail === 'left' ? `M${-w / 2 + 2} -4 L${-w / 2 - 10} 4 L${-w / 2 + 2} 8Z` : `M-8 ${h / 2 - 2} L-2 ${h / 2 + 10} L6 ${h / 2 - 2}Z`;
      S.path(td, { fill: o.fill ?? 'card', p: g });
      S.rect(-w / 2, -h / 2, w, h, { r: o.r ?? 14, fill: o.fill ?? 'card', stroke: o.stroke, sw: o.sw, p: g });
      if (o.text != null) g.label = S.text(0, 0, o.text, { size: o.size ?? 13, fill: o.color ?? 'ink', p: g });
      if (o.x != null) S.at(g, o.x, o.y ?? 0);
      return g;
    };
    // 神經網路：layers=[3,4,2]，回傳 { nodes:[[circle]], pos:[[{x,y}]], edges:[{a:[l,i], b:[l+1,j], el}] }
    S.nn = (layers, o = {}) => {
      const x0 = o.x0 ?? 110, x1 = o.x1 ?? 370, y0 = o.y0 ?? 60, y1 = o.y1 ?? 240, r = o.r ?? 11;
      const pos = layers.map((n, l) => Array.from({ length: n }, (_, i) => ({
        x: layers.length === 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * l / (layers.length - 1),
        y: n === 1 ? (y0 + y1) / 2 : y0 + (y1 - y0) * i / (n - 1),
      })));
      const eg = S.g({ p: o.p }), ng = S.g({ p: o.p });
      const edges = [];
      for (let l = 0; l < layers.length - 1; l++) pos[l].forEach((a, i) => pos[l + 1].forEach((b, j) => {
        edges.push({ a: [l, i], b: [l + 1, j], el: S.line(a.x, a.y, b.x, b.y, { stroke: 'line', sw: 1.6, p: eg }) });
      }));
      const nodes = pos.map((col, l) => col.map(q => S.circle(q.x, q.y, r, { fill: o.fill ?? 'card', stroke: o.stroke ?? 'sub', sw: 2, p: ng })));
      return { nodes, pos, edges, eg, ng };
    };
    S.bar = (x, base, w, h, o = {}) => { const e = S.rect(x, base - h, w, h, { r: o.r ?? 5, fill: o.fill ?? 'coral', p: o.p }); e._base = base; return e; };
    S.setBar = (e, h) => { h = Math.max(0, h); e.setAttribute('y', r2(e._base - h)); e.setAttribute('height', r2(h)); return e; };

    // 小圖示（24×24，置中於原點），S.icon('search', { s: 1.2, fill: 'ink', p })
    const IC = {
      search: g => { S.circle(-2, -2, 7, { fill: 'none', stroke: g.c, sw: 2.6, p: g }); S.line(3.5, 3.5, 9, 9, { stroke: g.c, sw: 3, p: g }); },

  // 靜態縮圖（群組頁卡片用）：畫在 t 秒；hover 時可播放

    host.addEventListener('pointerenter', () => { if (reduce()) return; t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); });

  function restTime(scene) {
    const st = scene.steps || [];
    const last = st.length ? st[st.length - 1][0] : scene.dur * .6;
    return Math.min(scene.dur - .05, last + Math.min(1.2, (scene.dur - last) * .6));
  }

      <div class="steps"></div>

    const caption = (force) => {
      let i = 0; steps.forEach((s, k) => { if (t >= s[0]) i = k; });
      if (i === cur && !force) return;
      cur = i;
      const m = getMode() === 'kid' ? 2 : 1;

  ],
  points: [
    '16／32 位元壓成 8／4 位元，記憶體大減',

T('temperature', {
  tagline: '控制回答要保守還是多變',
  normal: [
    '模型每產生一個字，都會先算出所有候選字的機率，再從中抽一個。Temperature（溫度）是調整這個機率分布形狀的參數。溫度低，高機率的字被放大，分布變尖，幾乎每次都選最可能的那個；溫度高，分布變平，冷門的字也有機會被抽中。',
    '所以同一個問題，溫度低時回答穩定、可重複，適合查資料、寫程式、做分類；溫度高時用字比較多變，適合發想標題或寫故事，但調太高就容易語無倫次。',
    '另一個常見參數是 Top-p（核取樣），只保留累積機率加起來達到 p 的那幾個候選字，其餘直接排除，再從留下的字裡抽。兩者常一起使用。',
  ],
  points: [
    '溫度低，分布變尖，回答穩定一致',
    '溫度高，分布變平，用字多變但可能失控',
    'Top-p 先排除機率太低的候選字再抽',
  ],
  analogy: '像點餐：溫度低的人每次都點招牌菜，溫度高的人會想試試菜單角落沒人點過的那道。',
  kidLine: '要說一樣的話，還是新的話',
  kid: [
    '小艾說話時，每個字都要從好幾個字裡選一個。',
    '溫度調低，小艾很乖，每次都選最常用的字，說的話都差不多。',
    '溫度調高，小艾變得很愛玩，常常選出好特別的字，有時候很有趣，有時候怪怪的。',
  ],
  related: ['next-token', 'hallucination', 'token', 'prompt', 'llm'],
  scene: {
    dur: 10.5,
    steps: [
      [0, '模型為下一個字算出機率，再從中抽一個（T = 1）', '小艾想下一個字，每個字都有機會'],
      [2.4, '調低 Temperature，分布變尖，幾乎每次都選「好」', '溫度低，小艾每次都說一樣的話'],
      [5, '調高 Temperature，分布變平，冷門字也常被抽中', '溫度高，小艾會說出意想不到的話'],
      [7.6, 'Top-p 0.8：只從累積機率前 80% 的字裡抽', '太奇怪的字，直接不選'],
    ],
    build(S) {
      const L = [2.2, 1.2, .9, .2, -.6], W = ['好', '熱', '棒', '冷', '怪'];
      S.text(200, 34, '今天天氣真', { size: 16, weight: 700 });
      const slot = S.token('？', { fill: 'sky', size: 16, w: 44, h: 32 });
      // 溫度計
      S.rect(42, 80, 16, 166, { r: 8, fill: 'soft', stroke: 'line', sw: 1.5 });
      const merc = S.rect(46, 200, 8, 46, { r: 4, fill: 'coral' });
      S.circle(50, 254, 13, { fill: 'coral' });
      const tl = S.text(50, 64, 'T = 1.0', { size: 13, weight: 700 });
      // 機率長條
      const bx = i => 120 + i * 68;
      const bars = W.map((w, i) => S.bar(bx(i), 246, 44, 0, { fill: 'sky' }));
      const pct = W.map((w, i) => S.text(bx(i) + 22, 230, '', { size: 11, fill: 'sub' }));
      const lab = W.map((w, i) => S.text(bx(i) + 22, 264, w, { size: 14, weight: 700 }));
      const tp = S.g();
      S.line(312, 84, 312, 250, { stroke: 'sub', dash: '4 5', p: tp });
      S.text(312, 72, 'Top-p 0.8', { size: 11, fill: 'sub', p: tp });
      const pick = S.circle(0, 0, 5, { fill: 'deep' });
      const Tm = t => {
        let T = 1;
        T = S.lerp(T, .3, S.seg(t, 2.4, 3.2));
        T = S.lerp(T, 1.8, S.seg(t, 5, 5.8));
        T = S.lerp(T, 1, S.seg(t, 7.4, 8));
        return T;
      };
      const probs = (T, m) => {
        const e = L.map(l => Math.exp(l / T)), s = e.reduce((a, b) => a + b, 0);
        let p = e.map(v => v / s);
        if (m > 0) { const keep = p[0] + p[1] + p[2]; p = p.map((v, i) => i < 3 ? S.lerp(v, v / keep, m) : S.lerp(v, 0, m)); }
        return p;
      };
      const PK = [[.8, 0], [1.5, 1], [3.4, 0], [3.9, 0], [4.4, 0], [6.1, 3], [6.6, 0], [7.1, 4], [8.6, 1], [9.1, 0], [9.6, 2]];
      return t => {
        const T = Tm(t), m = S.seg(t, 7.8, 8.4);
        tl.textContent = 'T = ' + T.toFixed(1);
        const h = 20 + (T - .3) / 1.5 * 136;
        merc.setAttribute('y', (246 - h).toFixed(1));
        merc.setAttribute('height', h.toFixed(1));
        const p = probs(T, m);

          const bh = 150 * v;
          S.setBar(bars[i], bh);
          S.fill(bars[i], i > 2 && m > 0 ? 'line' : 'sky');
          pct[i].setAttribute('y', (246 - bh - 10).toFixed(1));

          S.op(lab[i], i > 2 ? 1 - .65 * m : 1);
        });
        S.op(tp, m);
        let cur = -1, ts = 0;
        PK.forEach(([tt, i]) => { if (t >= tt) { cur = i; ts = tt; } });
        const hop = cur < 0 ? 0 : Math.sin(Math.PI * S.seg(t, ts, ts + .3));
        S.at(pick, cur < 0 ? bx(0) + 22 : bx(cur) + 22, 285 - 8 * hop);
        S.op(pick, cur < 0 ? 0 : 1);
        slot.label.textContent = cur < 0 ? '？' : W[cur];
        S.at(slot, 276, 34, 1 + .15 * hop);
      };
    },
  },
});

const arrowG7 = (S, x1, y1, x2, y2, o = {}) => { // 未畫出的箭頭整個隱藏，避免圓角線頭留下一個點
  const a = S.arrow(x1, y1, x2, y2, o), d = a.draw;
  a.draw = p => { d(p); a.on = p > 0 ? 1 : 0; S.op(a, a.on); return a; };
  return a.draw(0);
};

/* 群組 8：安全與評估 */

const arrowG8 = (S, x1, y1, x2, y2, o = {}) => { // 未畫出的箭頭整個隱藏，避免圓角線頭留下一個點
  const a = S.arrow(x1, y1, x2, y2, o), d = a.draw;
  a.draw = p => { d(p); a.on = p > 0 ? 1 : 0; S.op(a, a.on); return a; };
  return a.draw(0);
};

/* 遊戲測驗「AI 小卡大挑戰」：題目由概念資料自動出，每次都不一樣。
   題型：看說明猜概念、看動畫猜概念、比喻配對、屬於哪一組、哪一年發生（五歲版只出前兩種）。
   由 app.js 呼叫 Quiz.page() / Quiz.mount(ctx)。 */
(function () {
  const Q_COUNT = 10, HEARTS = 3;
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const strip = s => String(s).replace(/<[^>]+>/g, '');
  // 把題目文字裡的答案遮掉
  function mask(text, t) {
    const words = [t.name, t.en, ...t.name.split(/[\s／、]+/), ...t.en.split(/[\s/&]+/).filter(w => /[A-Z]/.test(w) && w.length > 2)]
      .filter(w => w && w.length >= 2).sort((a, b) => b.length - a.length);
    let s = strip(text);
    words.forEach(w => { s = s.split(w).join('〇〇'); });
    return s;
  }
  const TYPES = {
    tag: { label: '看說明猜概念', kid: '猜猜我是誰' },
    scene: { label: '看動畫猜概念', kid: '看動畫猜猜看' },
    analogy: { label: '比喻配對', kid: '' },
    group: { label: '屬於哪一組', kid: '' },
    year: { label: '哪一年發生', kid: '' },
  };

  function pickOptions(t, pool) {
    const same = shuffle(pool.filter(id => id !== t.id && TERMS[id].g === t.g));
    const other = shuffle(pool.filter(id => id !== t.id && TERMS[id].g !== t.g));
    const all = shuffle(ORDER.filter(id => id !== t.id));
    const picks = [...same.slice(0, 2), ...other, ...all].filter((v, i, a) => a.indexOf(v) === i).slice(0, 3);
    return shuffle([t.id, ...picks]).map(id => ({ key: id, text: TERMS[id].name, ok: id === t.id }));
  }

  function makeQuestions(level, kid) {
    const pool = ORDER.filter(id => TERMS[id].scene && (!level || TERMS[id].level === level));

      <defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--line2)"/></marker></defs>
      <text x="40" y="44" font-size="12.5" font-weight="700" letter-spacing="3" style="fill:var(--sub)">造模型</text><path d="M96 40 H682" style="stroke:var(--line)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
      <text x="748" y="44" font-size="12.5" font-weight="700" letter-spacing="3" style="fill:var(--sub)">用模型</text>
      <text x="40" y="440" font-size="12.5" font-weight="700" letter-spacing="3" style="fill:var(--sub)">擴充模型</text>
      ${edge(`M${X[0] + W + 8} 142 H${X[1] - 10}`, '打造出', gx(0), 84)}
      ${edge(`M${X[1] + W + 8} 142 H${X[2] - 10}`, '經過訓練', gx(1), 84)}
      ${edge(`M${X[2] + W + 8} 142 H${X[3] - 10}`, '變成助手', gx(2), 84)}
      ${edge(`M${X[3] + W / 2} 196 V290`, '知識不足時', X[3] + W / 2 + 12, 244, 'start')}
      ${edge(`M${X[3] - 8} 346 H${X[2] + W + 10}`, '需要行動時', gx(2), 288)}
      ${edge(`M${X[1] + W / 2} 196 C${X[1] + W / 2} 262 ${X[0] + W / 2} 236 ${X[0] + W / 2} 290`, '感官延伸', X[1] + W / 2 - 4, 262, 'end')}
      <rect x="${X[2] - 14}" y="268" width="${X[3] + W - X[2] + 28}" height="142" rx="30" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="6 7" opacity=".7"/>
      <text x="${X[3] + W + 14}" y="430" text-anchor="end" font-size="12.5" font-weight="700" style="fill:var(--accent-deep)">Agent ＝ 推論＋外掛知識＋動手做事</text>
      ${[1, 2, 3, 4, 5, 6, 7].map(node).join('')}
      <a class="map-node" href="#g8"><g class="mn-card"><rect x="40" y="456" width="878" height="52" rx="20" style="fill:var(--c-sage)"/><text x="64" y="483" font-weight="700" font-size="16" style="fill:var(--on-pastel)" dominant-baseline="central">08　安全與評估：橫跨每一層</text>
      ${[1, 2, 3, 4, 5, 6, 7].map(i => `<path transform="translate(${450 + i * 60} 482) scale(.7)" d="${flowerPath(12)}" fill="rgba(255,255,255,.55)"/>`).join('')}</g></a>
    </svg>`;
    return `<div class="page">
      <header class="ghead" style="grid-template-columns:1fr"><div><div class="eyebrow">RELATIONS</div><h1 style="margin-top:10px">群組關係圖</h1>
      <p class="desc ${isKid() ? 'kid-say' : ''}">${isKid() ? '先做出一顆會思考的大腦，教它長大，再幫它找資料、給它一雙手。旁邊一直有人看著它，確保它做好事。' : '地基打造出 LLM，經過訓練流程變成好用的助手；推論時遇到知識不足就靠 RAG，需要行動就變成 Agent。多模態是 LLM 的感官延伸，安全評估橫跨每一層。點任一群組可進入。'}</p></div></header>
      <div class="map-wrap">${svg}</div>
      <section class="sec"><div class="sec-head"><h2>值得畫線的關鍵連線</h2></div>
      <div class="rels">${RELATIONS.map(r => `<div class="rel"><h3>${esc(r.title)}</h3><div class="chain">${r.chain.map((id, i) => (i ? `<i>${i === r.chain.length - 1 && r.last ? r.last : r.sep}</i>` : '') + chip(id)).join('')}</div><p>${esc(isKid() ? r.kid : r.normal)}</p></div>`).join('')}</div></section>
    </div>`;
  }

  /* ---------- 頁面：時間軸 ---------- */
  let tlFilter = 0;
  const ERAS = { 1950: ['萌芽期：「人工智慧」誕生', 'AI 寶寶出生了'], 2012: ['深度學習爆發', 'AI 學會看圖片'], 2017: ['Transformer 與大型語言模型', 'AI 學會說話'], 2023: ['Agent 時代', 'AI 長出了一雙手'] };
  function pageTimeline() {
    const big = new Set(['1956', '2017', '2022.11', '2024.11']);
    return `<div class="page">
      <header class="ghead" style="grid-template-columns:1fr"><div><div class="eyebrow">TIMELINE・1950–2026</div><h1 style="margin-top:10px">AI 時間軸</h1>
      <p class="desc ${isKid() ? 'kid-say' : ''}">${isKid() ? '從爺爺奶奶小時候就開始了！AI 一路長大，最近幾年長得特別快。' : '從圖靈測試到 Agent Skills，七十多年的關鍵節點。點概念標籤可直接跳到說明，上方可依群組篩選。'}</p></div></header>
      <div class="tl-filter" role="group" aria-label="依群組篩選"><button data-f="0" aria-pressed="${tlFilter === 0}">全部</button>${GROUPS.map(g => `<button data-f="${g.n}" style="${gc(g.n)}" aria-pressed="${tlFilter === g.n}">${esc(g.short)}</button>`).join('')}</div>
      <div class="tl">${TIMELINE.map((e, i) => { const era = ERAS[e.y] && (i === 0 || TIMELINE[i - 1].y !== e.y) ? `<div class="era"><span>${esc(ERAS[e.y][isKid() ? 1 : 0])}</span></div>` : ''; const gs = [...new Set(e.ids.map(id => TERMS[id].g))]; const key = e.y + (e.m ? '.' + e.m : ''); return era + `<div class="ev ${big.has(key) ? 'big' : ''}" data-gs="${gs.join(',')}" style="--i:${i};${gc(gs[0])}"><div class="yr">${e.y}${e.m ? `<small>${e.m} 月</small>` : ''}</div><div class="card"><p>${esc(e.t)}</p><div class="chips">${e.ids.map(chip).join('')}</div></div></div>`; }).join('')}</div>
    </div>`;
  }
  function mountTimeline() {
    const apply = () => $$('.ev').forEach(ev => ev.hidden = tlFilter && !ev.dataset.gs.split(',').includes(String(tlFilter)));
    $$('.tl-filter button').forEach(b => b.onclick = () => { tlFilter = +b.dataset.f; $$('.tl-filter button').forEach(x => x.setAttribute('aria-pressed', x === b)); apply(); });
    apply();
  }

  /* ---------- 頁面：學習路徑 ---------- */
  function pagePath() {
    return `<div class="page">
      <header class="ghead" style="grid-template-columns:1fr"><div><div class="eyebrow">LEARNING PATH</div><h1 style="margin-top:10px">學習路徑</h1>
      <p class="desc ${isKid() ? 'kid-say' : ''}">${isKid() ? '像玩闖關遊戲一樣，一關一關往前走。學會了就按「我學會了」，這裡會幫你打勾。' : '依難度分成三關，每關內依群組順序排列。在概念頁按「我學會了」，進度會記在這台瀏覽器上。'}</p></div></header>
      <div class="road">${[1, 2, 3].map(l => { const ids = ORDER.filter(id => TERMS[id].level === l), d = ids.filter(id => learned.has(id)).length; return `<section class="stagep"><header><h2><span class="lvnum">${l}</span>${LEVELS[l].name}</h2><div style="min-width:180px;flex:1;max-width:280px"><small style="color:var(--sub)">完成 ${d} / ${ids.length}</small><div class="meter"><i style="width:${d / ids.length * 100}%"></i></div></div></header>
        <p style="color:var(--sub)" class="${isKid() ? 'kid-say' : ''}">${esc(isKid() ? LEVELS[l].kid : LEVELS[l].note)}</p>
        <div class="stops">${ids.map(id => `<a class="stop ${learned.has(id) ? 'done' : ''}" style="${gc(TERMS[id].g)}" href="#t-${id}">${esc(TERMS[id].name)}</a>`).join('')}</div></section>`; }).join('')}</div>
    </div>`;
  }

  const quizCtx = { store, mascot, isKid };

  /* ---------- 路由 ---------- */
  function route() { const h = location.hash.slice(1); return h || 'home'; }
  let lastRoute = '';
  function render(keepScroll) {
    let r = route();
    if (r.startsWith('t-') && !TERMS[r.slice(2)]) r = 'home';
    if (/^g\d$/.test(r) && !GROUPS[+r[1] - 1]) r = 'home';
    const y = window.scrollY;
    player = null;
    if (r === 'home') view.innerHTML = pageHome();
    else if (r === 'map') view.innerHTML = pageMap();
    else if (r === 'timeline') view.innerHTML = pageTimeline();
    else if (r === 'path') view.innerHTML = pagePath();
    else if (r === 'quiz') view.innerHTML = Quiz.page(quizCtx);
    else if (r.startsWith('g')) view.innerHTML = pageGroup(+r.slice(1));
    else view.innerHTML = pageTerm(r.slice(2));
    if (r === 'home') mountHome();
    else if (r === 'quiz') Quiz.mount(quizCtx);
    else if (r === 'timeline') mountTimeline();
    else if (r.startsWith('g')) mountGroup();
    else if (r.startsWith('t-')) mountTerm(r.slice(2));
    // 麵包屑
    const t = r.startsWith('t-') && TERMS[r.slice(2)];
    const gn = t ? t.g : r.startsWith('g') ? +r.slice(1) : 0;
    const names = { home: '首頁', map: '群組關係圖', timeline: '時間軸', path: '學習路徑', quiz: '遊戲測驗' };
    crumb.innerHTML = gn ? `<a href="#home">首頁</a> / ${t ? `<a href="#g${gn}">${esc(G(gn).name)}</a> / <b>${esc(t.name)}</b>` : `<b>${esc(G(gn).name)}</b>`}` : `<b>${names[r] || ''}</b>`;
    document.title = (t ? t.name + '｜' : gn ? G(gn).name + '｜' : '') + 'AI小卡棒棒棒！';
    syncSide(r);
    app.classList.remove('nav-open');
    if (keepScroll && r === lastRoute) window.scrollTo(0, y); else window.scrollTo(0, 0);
    lastRoute = r;
  }

  // 3D 卡片隨滑鼠傾斜
  document.addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest('[data-tilt]');
    if (!c) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    c.style.setProperty('--ry', (x * 30).toFixed(2)); c.style.setProperty('--rx', (-y * 24).toFixed(2));
  });
  document.addEventListener('pointerout', e => { const c = e.target.closest && e.target.closest('[data-tilt]'); if (c && !c.contains(e.relatedTarget)) { c.style.setProperty('--rx', 0); c.style.setProperty('--ry', 0); } });

  buildSide();
  $('#mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.m !== mode) setMode(b.dataset.m); });
  $('#menuBtn').onclick = () => app.classList.toggle('nav-open');
  $('#scrim').onclick = () => app.classList.remove('nav-open');
  window.addEventListener('hashchange', () => render(false));
  document.body.classList.toggle('kid', isKid());
  $('#mode').classList.toggle('kid', isKid());
  $$('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
  render(false);
})();

</script>

</body>
</html>
